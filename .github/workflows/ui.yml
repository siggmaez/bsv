name: Android UI checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            size: 1280x720
          - api: 35
            size: 1920x1080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 320
            ./gradlew :app:connectedDebugAndroidTest
            adb shell am start -n dev.bsv.visuals/dev.bsv.app.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/bsv.png
            adb pull /sdcard/bsv.png bsv-api-${{ matrix.api }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-checks-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            bsv-api-*.png
