name: Android Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :core-settings:testDebugUnitTest :app:lintDebug
      - name: Verify and name universal APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BSV-v0.1.0-android-universal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BSV-v0.1.0-android-universal-debug
          path: dist/*.apk
          if-no-files-found: error
